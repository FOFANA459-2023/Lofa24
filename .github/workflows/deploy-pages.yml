name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Sets GITHUB_PAGES, NEXT_PUBLIC_BASE_PATH and NEXT_PUBLIC_SITE_ORIGIN
      # (see the build:pages script in package.json) and writes ./out.
      - run: npm run build:pages

      # Belt and braces: the Actions deploy path does not run Jekyll, but this
      # keeps the output correct if the source is ever switched to a branch.
      - run: touch out/.nojekyll

      # Fails early with a clear message if Pages is not enabled, or is still
      # set to "Deploy from a branch" instead of "GitHub Actions".
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
          # Without this the artifact tar drops every dotfile, .nojekyll included.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
